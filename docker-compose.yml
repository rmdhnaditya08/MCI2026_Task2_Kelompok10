version: '3.8'
x-airflow-common:
  &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__SECRET_KEY=rahasia_pelatihan_mmds_12345
    - AIRFLOW__WEBSERVER__BASE_URL=https://103.253.147.216/airflow
    - AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX=/airflow
    - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True
    - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
    - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data_lake:/opt/airflow/data_lake
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow connections create-default-connections &&
      (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || echo 'User already exists')"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=rahasia
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

  metabase:
    image: metabase/metabase:latest
    environment:
      - MB_JETTY_CONTEXT_PATH=/metabase
      - MB_SITE_URL=https://103.253.147.216/metabase
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse-server

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - airflow-webserver
      - metabase
      - clickhouse-server