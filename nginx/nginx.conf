worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream airflow_web {
    server airflow-webserver:8080;
  }

  upstream metabase_web {
    server metabase:3000;
  }

  upstream clickhouse_http {
    server clickhouse-server:8123;
  }

  server {
    listen 80;
    server_name 103.253.147.216;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name 103.253.147.216;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    location = /airflow { return 301 /airflow/; }
    location /airflow/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /airflow;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://airflow_web;
      proxy_redirect off;
    }

    location = /metabase { return 301 /metabase/; }
    location /metabase/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /metabase;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_pass http://metabase_web;
      proxy_redirect off;
    }

    location = /clickhouse { return 301 /clickhouse/; }
    location /clickhouse/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_pass http://clickhouse_http/;
      proxy_redirect off;
    }
  }
}
